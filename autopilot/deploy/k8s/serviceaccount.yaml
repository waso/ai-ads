# Workload Identity: the pod acts as this Google service account, which was added to the Google Ads account as a
# Standard user (never Admin). There is no key file anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ads-autopilot
  namespace: ads-autopilot
  annotations:
    iam.gke.io/gcp-service-account: ads-autopilot@PROJECT_ID.iam.gserviceaccount.com
